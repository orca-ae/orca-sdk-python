[project]
name = "orca-sdk"
version = "0.1.1"
description = "Python client for the Orca Agent Engine API"
dynamic = ["readme"]
license = "Apache-2.0"
authors = [{ name = "StreamNative, Inc." }]

dependencies = [
  "httpx2>=2.0.0, <3",
  "pydantic>=2.0.0, <3",
  "typing-extensions>=4.14, <5",
  "anyio>=3.5.0, <5",
  "sniffio>=1, <2",
]

requires-python = ">= 3.10"
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/orca-ae/orca-sdk-python"
Repository = "https://github.com/orca-ae/orca-sdk-python"

[tool.uv]
managed = true
index = [{ url = "https://pypi.org/simple", default = true }]

[dependency-groups]
dev = [
    "pyright==1.1.399",
    "mypy==1.17",
    "respx",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "dirty-equals>=0.6.0",
    "importlib-metadata>=6.7.0",
    "pytest-xdist>=3.6.1",
    "PyYAML>=6",
]

[build-system]
requires = ["hatchling==1.26.3", "hatch-fancy-pypi-readme>=22.4, <26"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/orca"]

[tool.hatch.build.targets.sdist]
include = ["/*.toml", "/*.json", "/*.lock", "/*.md", "examples/*", "src/*", "tests/*"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -n auto -p tests._alias_httpx"
pythonpath = ["."]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["error"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
exclude = [".git", "_dev", ".venv", ".nox"]
reportImplicitOverride = true
reportOverlappingOverload = false
reportImportCycles = false
reportPrivateUsage = false

[tool.mypy]
pretty = true
show_error_codes = true
exclude = ["src/orca/_files.py", "_dev/.*.py", "tests/.*"]
strict_equality = true
implicit_reexport = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = false
warn_redundant_casts = false
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_subclassing_any = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
cache_fine_grained = true
disable_error_code = "func-returns-value,overload-cannot-match"

[tool.ruff]
line-length = 120
output-format = "grouped"
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["I", "B", "F401", "FA102", "E722", "ARG", "T201", "T203", "TC004", "TID251"]
ignore = ["B006"]
unfixable = ["T201", "T203"]
extend-safe-fixes = ["FA102"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"functools.lru_cache".msg = "This function does not retain type information for the wrapped function's arguments; The `lru_cache` function from `_utils` should be used instead"

[tool.ruff.lint.isort]
length-sort = true
length-sort-straight = true
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
known-first-party = ["orca", "tests"]

[tool.ruff.lint.per-file-ignores]
"bin/**.py" = ["T201", "T203"]
"scripts/**.py" = ["T201", "T203"]
"tests/**.py" = ["T201", "T203"]
"examples/**.py" = ["T201", "T203"]
