name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: ./scripts/lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - run: ./scripts/test
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build
      - name: Verify the built wheel imports cleanly
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/python -c 'import orca; print(orca.__version__)'
