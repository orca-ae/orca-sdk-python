name: Feature request
description: Propose a new capability or a change in behavior.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas are often easier to explore in
        [Discussions](https://github.com/orca-ae/orca-sdk-python/discussions/categories/ideas) first.

        This SDK follows the engine's API: every public method maps to an operation in the engine's
        OpenAPI spec. New endpoints, fields and server behavior start on the
        [engine repository](https://github.com/orca-ae/orca-agent-engine/issues).
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and what gets in your way today. Leave the solution for the next field.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives have you considered?
  - type: dropdown
    id: scope
    attributes:
      label: Does this need an API change in the engine?
      description: >-
        SDK-only changes cover ergonomics, helpers, typing, retries and documentation. Anything the
        server has to do differently needs an engine API change first.
      options:
        - "No — SDK only"
        - "Yes — needs an engine API change"
        - Not sure
    validations:
      required: true
