name: Bug report
description: Something in the Python SDK doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please don't report security vulnerabilities here.
        Follow the [security policy](https://github.com/orca-ae/.github/blob/main/SECURITY.md) instead.

        If the server misbehaves no matter which client sends the request, report it on the
        [engine repository](https://github.com/orca-ae/orca-agent-engine/issues) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and include the full error message or traceback.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The smallest script that shows the problem. Remove API keys and other secrets.
      render: python
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: 'Run `python -c "import orca; print(orca.__version__)"`.'
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine version and deployment
      description: The engine version you're calling, and whether it's self-hosted or the hosted service.
      placeholder: "self-hosted v0.5.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: 'Run `python --version`.'
      placeholder: "3.12.4"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, and anything else that might matter.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        Set `ORCA_LOG=debug` to log each request and response. Remove API keys and other secrets before
        you paste. The output is formatted as code automatically.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and didn't find this problem.
          required: true
        - label: This isn't a security vulnerability.
          required: true
